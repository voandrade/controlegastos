<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="saldos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Termômetro de Saldos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --zoom:1.05; /* escala geral da interface */
  --bg-canvas:#FFFFFF;--surface:#FFFFFF;--bg-subtle:#EDEDEE;--bg-muted:#F8EDD9;--bg-inverse:#0E2D23;
  --text-primary:#1D1F23;--text-secondary:#393E46;--text-muted:#6C7179;--text-faint:#B6B8BC;
  --border:#DADBDD;--border-strong:#B6B8BC;--brand:#FF5917;--accent-violet:#4A1BB9;
  --success:#529952;--error:#E62D2D;--warning:#FFD748;--info:#7C3AED;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s-other:#8E9196;--eco-line:#5A8F0E;
  --grid:rgba(29,31,35,.1);--shadow:rgba(0,0,0,.08);--overlay:rgba(14,17,20,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-canvas:#1D1F23;--surface:#2B2E34;--bg-subtle:#363A41;--bg-muted:#3A342A;
    --text-primary:#EDEDEE;--text-secondary:#D3D5D8;--text-muted:#9A9EA6;--text-faint:#5E636B;
    --border:#40444C;--border-strong:#5A5F68;--grid:rgba(255,255,255,.08);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s-other:#7D8188;--eco-line:#84CC16;--shadow:rgba(0,0,0,.35);--overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-canvas:#1D1F23;--surface:#2B2E34;--bg-subtle:#363A41;--bg-muted:#3A342A;
  --text-primary:#EDEDEE;--text-secondary:#D3D5D8;--text-muted:#9A9EA6;--text-faint:#5E636B;
  --border:#40444C;--border-strong:#5A5F68;--grid:rgba(255,255,255,.08);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s-other:#7D8188;--eco-line:#84CC16;--shadow:rgba(0,0,0,.35);--overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{zoom:var(--zoom)}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg-canvas);color:var(--text-primary);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;height:calc(100vh / var(--zoom));height:calc(100dvh / var(--zoom))}

/* sidebar */
.side{width:140px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px 12px;gap:4px;background:var(--surface);transition:width .2s}
.logo{display:flex;align-items:center;gap:8px;padding:2px 6px 16px}
.lg{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.lt{font-weight:700;font-size:16px}
.side nav,.acts{display:flex;flex-direction:column;gap:2px}
.side hr{border:0;border-top:1px solid var(--border);margin:10px 4px;width:auto}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;position:relative;color:var(--text-secondary);font-weight:500;width:100%;text-align:left;white-space:nowrap}
.nv:hover{background:var(--bg-subtle)}
.nv.on{color:var(--brand)}
.nv.on::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nv svg{width:18px;height:18px;flex:none}
.nv .plus{color:var(--text-primary)}
.cal{width:18px;height:18px;border:1.6px solid currentColor;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;flex:none;position:relative;padding-top:2px}
.cal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:currentColor}
.hz{width:18px;height:18px;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;flex:none;border:1px solid var(--border)}
.hz i{flex:1}
.collapse{margin-top:auto;align-self:flex-start;width:28px;height:28px;border-radius:8px;color:var(--text-muted);font-size:18px}
.collapse:hover{background:var(--bg-subtle)}
.app.col .side{width:60px}
.app.col .lb,.app.col .lt{display:none}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);gap:12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top .right{justify-self:end}
.pnav{display:flex;align-items:center;gap:4px}
.pnav>button{width:30px;height:30px;border-radius:8px;color:var(--text-secondary);font-size:15px}
.pnav>button:hover{background:var(--bg-subtle)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-weight:500;background:var(--surface);white-space:nowrap}
.pnav .pill{width:auto;height:auto}
.pill:hover{border-color:var(--border-strong)}
.car{color:var(--text-muted);font-size:11px}
.content{flex:1;min-height:0;overflow:auto;padding:20px 24px}
.content.flush{overflow:hidden;padding:16px 24px 12px}

/* type icons */
.ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:700;flex:none;line-height:1}
.ic.sm{width:14px;height:14px;font-size:8px}
.ic.lg{width:26px;height:26px;font-size:13px}
.ic.gray{background:var(--border);color:var(--surface)}
.ic.dotted{background:transparent;border:1.5px dashed var(--c);color:var(--c)}

/* months grid */
.months{display:flex;gap:16px;overflow-x:auto;height:100%;position:relative;padding-bottom:6px;scroll-snap-type:x proximity}
.mcard{flex:none;width:800px;border:1px solid var(--border);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 2px 8px var(--shadow);min-height:0;overflow:hidden;scroll-snap-align:start}
.mtitle{padding:14px 16px 10px;font-weight:700;font-size:17px}
.tw{flex:1;overflow-y:auto;min-height:0}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:500;color:var(--text-muted);font-size:13.5px;padding:9px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.grid th:first-child{text-align:center}
.grid td{padding:0 8px;height:30px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
.grid tfoot td{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-bottom:0;font-weight:700;z-index:2;height:36px}
.cw{display:flex;align-items:center;justify-content:space-between;gap:6px}
td.v{cursor:pointer}
td.v.z{color:var(--text-faint)}
td.v:hover,td.sal:hover{background-image:linear-gradient(90deg,transparent,rgba(255,89,23,.12))}
td.dia{text-align:center;width:40px;font-weight:500;color:var(--text-secondary)}
td.dia.we{background:var(--bg-subtle)}
td.dia.td{background:var(--text-primary);color:var(--bg-canvas);font-weight:700}
tr.today td{border-bottom:2px solid var(--text-primary)}
td.sal{font-weight:700;cursor:pointer;border-bottom-color:rgba(0,0,0,.06)}

/* horizonte */
.hwrap{height:100%;overflow:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:0 2px 8px var(--shadow)}
table.hzt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:11.5px}
.hzt th{position:sticky;top:0;background:var(--surface);z-index:2;padding:10px 6px;font-weight:700;border-bottom:1px solid var(--border);border-left:1px solid var(--border);white-space:nowrap}
.hzt th.cur{background:var(--text-primary);color:var(--bg-canvas)}
.hzt td{height:26px;border-bottom:1px solid var(--grid);white-space:nowrap}
.hzt td.hd{width:30px;text-align:center;color:var(--text-muted);border-left:1px solid var(--border)}
.hzt td.hd.we{background:var(--bg-subtle)}
.hzt td.hd.td{background:var(--text-primary);color:var(--bg-canvas);font-weight:700}
.hzt td.hs{min-width:58px;text-align:right;padding:0 8px;font-weight:700;cursor:pointer}
.hzt td.hs:hover{filter:brightness(.95)}
.hzt td.nil{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--grid) 4px 5px)}

/* generic blocks */
.narrow{max-width:960px;margin:0 auto}
.narrow.sm{max-width:560px}
h2.sec{font-size:15px;margin:26px 0 12px;font-weight:700}
h2.sec:first-child{margin-top:4px}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tc{border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--surface);box-shadow:0 2px 8px var(--shadow);display:flex;flex-direction:column;gap:10px}
.tc h3{margin:0;font-size:14px;font-weight:700}
.fx{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--text-muted);font-weight:700}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.big.neg{color:var(--error)}
.st{color:var(--text-muted)}
.prog{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--bg-subtle);overflow:hidden}
.bar i{display:block;height:100%;background:#84CC16;border-radius:99px}
.lst{border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:0 2px 8px var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--grid);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row.link:hover{background:var(--bg-subtle)}
.grow{flex:1;min-width:0}
.chev{color:var(--text-muted);font-size:18px}
.ri{width:22px;display:grid;place-items:center;color:var(--text-secondary)}
.ri svg{width:18px;height:18px}
.muted{color:var(--text-muted)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--text-muted)}
.sh{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sh h2{font-size:15px;margin:0}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);font-size:18px;display:grid;place-items:center;background:var(--surface)}
.iconbtn:hover{border-color:var(--border-strong)}
.back{color:var(--text-muted);font-weight:500;margin-bottom:6px;padding:4px 0}
.prof{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.av{width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.prof b{display:block;font-size:17px}
.badge{display:inline-block;margin-top:4px;background:#E3F3E3;color:#2F6B2F;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:0 12px;background:var(--surface)}
.search svg{width:16px;height:16px;color:var(--text-muted)}
.search input{border:0;outline:0;background:transparent;padding:10px 0;flex:1}
.btn{border-radius:12px;padding:10px 16px;font-weight:700;background:var(--text-primary);color:var(--bg-canvas);white-space:nowrap}
.btn.light{background:var(--surface);color:var(--text-primary);border:1px solid var(--border)}
.tagdot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.08)}
.tagchip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-weight:500;color:#1D1F23}
.dots{width:28px;height:28px;border-radius:8px;color:var(--text-muted);font-size:17px;flex:none}
.dots:hover{background:var(--bg-subtle)}
.danger-t{color:var(--error)}
.check{color:var(--brand);font-weight:700}
select.inl{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--surface)}
.moneyin{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--surface);width:140px;text-align:right;font-variant-numeric:tabular-nums}

/* overlay / drawer / modal */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;animation:fd .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:370px;max-width:100vw;background:var(--surface);z-index:51;display:flex;flex-direction:column;box-shadow:-8px 0 30px var(--shadow);animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;border-bottom:1px solid var(--border)}
.dh .mid{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.hb{width:32px;height:32px;border-radius:9px;font-size:16px;color:var(--text-secondary)}
.hb:hover{background:var(--bg-subtle)}
.df{padding:12px 14px 4px}
.dl{flex:1;overflow-y:auto;padding:4px 6px 16px}
.it{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--grid)}
.itx{flex:1;min-width:0}
.itx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itx small,.itv small{color:var(--text-muted);font-size:11.5px}
.itv{text-align:right;font-variant-numeric:tabular-nums}
.itv span{display:block;font-weight:700}
.sk{height:44px;border-radius:10px;margin:10px 8px;background:linear-gradient(90deg,var(--bg-subtle),var(--surface),var(--bg-subtle));background-size:200% 100%;animation:sk 1s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.ov.center{display:grid;place-items:center;padding:16px}
.modal{width:420px;max-width:100%;background:var(--surface);border-radius:16px;padding:18px 20px 20px;max-height:calc(92vh / var(--zoom));overflow:auto;box-shadow:0 20px 50px var(--shadow);animation:pp .18s ease-out}
.modal.sm{width:360px}
@keyframes pp{from{transform:scale(.97);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh h3{margin:0;font-size:17px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--grid);min-height:52px;flex-wrap:wrap}
.fi{width:20px;color:var(--text-muted);display:grid;place-items:center;flex:none}
.fi svg{width:18px;height:18px}
.frow input:not([type=checkbox]),.frow select{flex:1;border:0;background:transparent;font-size:15px;outline:none;min-width:0}
.frow input.val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.frow label.fl{color:var(--text-muted);width:100%;font-size:12px;margin:-4px 0 -6px 32px}
.sel{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:1px solid var(--border);border-radius:99px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--text-primary)}
.primary{width:100%;margin-top:18px;border-radius:12px;padding:13px;font-weight:700;color:#fff;background:var(--text-primary);font-size:15px}
.primary.dark{color:var(--bg-canvas)}
.primary.danger{background:var(--error);color:#fff}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;margin:0}
.ghost{border:1px solid var(--border);border-radius:12px;padding:12px;font-weight:700}
.err{color:var(--error);font-size:12px;margin-top:8px;min-height:1em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--text-primary)}
.adv{margin-top:10px}
.advh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 0;font-weight:700}
.adv p{margin:0 0 8px;color:var(--text-muted);font-size:12px}
.flag{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:2px}
.seg button{padding:4px 12px;border-radius:999px;font-weight:500;color:var(--text-muted)}
.seg button.on{background:var(--brand);color:#fff}
.counter{text-align:center;color:var(--text-muted);font-size:12px;margin-top:10px}

/* popover */
.pop{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px var(--shadow);padding:6px;min-width:200px;max-width:320px;animation:pp .12s}
.pop .pt{padding:8px 10px 4px;color:var(--text-muted);font-size:12px}
.pi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.pi:hover{background:var(--bg-subtle)}
.pi b{display:block;font-weight:700}
.pi small{display:block;color:var(--text-muted);font-size:11.5px}
.pi.danger b{color:var(--error)}
.pi .grow{flex:1}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.chk:hover{background:var(--bg-subtle)}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.wsum .tc{gap:4px;padding:14px 16px}
.wsum .tc .num{font-size:20px}
.wlist{display:flex;flex-direction:column;gap:12px}
.wcard{border:1px solid var(--border);border-radius:16px;padding:16px;background:var(--surface);box-shadow:0 2px 8px var(--shadow);display:flex;flex-direction:column;gap:10px}
.wcard.done{opacity:.6}
.wtop{display:flex;align-items:center;gap:10px}
.wtop b{font-size:15px}
.wrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wok{color:var(--success);font-weight:700}
.wbad{color:var(--error);font-weight:700}
.btn.sm{padding:7px 12px;font-size:12.5px;align-self:flex-start}
.selo{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--bg-subtle);color:var(--text-muted)}
@media (max-width:760px){.wsum{grid-template-columns:1fr}}
.ahero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ahero .tc{gap:4px;padding:14px 16px}
.ahero .num{font-size:22px}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vc{border:1px solid var(--border);border-radius:16px;padding:16px 18px;background:var(--surface);box-shadow:0 2px 8px var(--shadow);min-width:0}
.vc.full{grid-column:1/-1}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.vh h3{margin:0;font-size:15px}
.vh small{display:block;color:var(--text-muted);margin-top:2px}
.vt{font-size:12px;color:var(--text-muted);border:1px solid var(--border);border-radius:99px;padding:4px 10px;white-space:nowrap}
.vt:hover{border-color:var(--border-strong)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--border-strong);stroke-width:1}
.chart .ax{fill:var(--text-muted);font-size:11px;font-family:inherit}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--text-primary);fill-opacity:.06}
.chart .tdy{stroke:var(--text-primary);stroke-width:1.5;stroke-dasharray:3 3}
.chart .tdl{fill:var(--text-primary);font-size:11px;font-weight:700}
.chart .ref{stroke:var(--text-muted);stroke-width:1.5;stroke-dasharray:5 4}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 8px;color:var(--text-secondary)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lgd b{font-variant-numeric:tabular-nums}

<script>
/* ============ constantes editáveis ============ */
const LIMITES = { lowest: -500, low: 0, base: 1000, high: 2000 }; // em reais
const TONES = {
  lowest: ['#F26D70', '#5C1212'], low: ['#F8BEBF', '#8A1B1B'], base: ['#FCE9B5', '#66561D'],
  high: ['#95FDB8', '#315C31'], highest: ['#96D87D', '#213D21']
};
function tone(c) {
  const v = c / 100;
  if (v < LIMITES.lowest) return 'lowest';
  if (v < LIMITES.low) return 'low';
  if (v <= LIMITES.base) return 'base';
  if (v <= LIMITES.high) return 'high';
  return 'highest';
}
const TIPOS = {
  entrada:  { nome: 'entrada', col: 'entradas', tot: 'entradas', ic: '↙', cor: '#529952', desc: 'salário, comissão, vales' },
  saida:    { nome: 'saída', col: 'saídas', tot: 'saídas', ic: '↗', cor: '#E62D2D', desc: 'gastos fixos, boletos, aluguel' },
  diario:   { nome: 'diário', col: 'diários', tot: 'diários', ic: 'D', cor: '#E563DD', desc: 'gastos variáveis, compras' },
  economia: { nome: 'economia', col: 'economias', tot: 'economias', ic: 'E', cor: '#84CC16', desc: 'reserva, investimento' },
  cartao:   { nome: 'gasto com cartão', col: 'cartão', tot: 'gastos com cartão', ic: 'C', cor: '#7C3AED', desc: 'gastos ou total da fatura' }
};
const ORD = ['entrada', 'saida', 'diario', 'economia', 'cartao'];
const REP = {
  mensal: ['mensalmente', 'repete todo mês no mesmo dia'],
  semanal: ['semanalmente', 'repete toda semana no mesmo dia'],
  diaria: ['diariamente', 'repete todos os dias'],
  parcelado: ['parcelado', 'divide o valor em parcelas mensais'],
  nao_repete: ['não repete', 'lançamento único']
};
const TAGCORES = { verde: '#ADE695', amarelo: '#F0F0B3', vermelho: '#FFB3B3', rosa: '#FFCCD9', azul: '#BEE0FF', roxo: '#CCB8F2', cinza: '#E0E0E0', marrom: '#E8D5C2', laranja: '#FFD6B3', turquesa: '#B5EBE3' };
const FLAGS = [['saldos', 'saldos'], ['performance', 'performance'], ['economizado', 'economizado'], ['custoDeVida', 'custo de vida'], ['diarioMedio', 'diário médio']];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MAB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MAX_TAGS = 100;

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const parse = k => { const [a, b, c] = k.split('-').map(Number); return { y: a, m: b - 1, d: c }; };
const dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const addDays = (k, n) => { const p = parse(k); const t = new Date(Date.UTC(p.y, p.m, p.d + n)); return key(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const monthAdd = (y, m, k) => { const t = y * 12 + m + k; return { y: Math.floor(t / 12), m: ((t % 12) + 12) % 12 }; };
const clampKey = (y, m, d) => key(y, m, Math.min(d, dim(y, m)));
const lastDay = o => key(o.y, o.m, dim(o.y, o.m));
const dow = k => { const p = parse(k); return new Date(Date.UTC(p.y, p.m, p.d)).getUTCDay(); };
const ddmm = k => { const p = parse(k); return `${pad(p.d)}/${pad(p.m + 1)}`; };
const _now = new Date();
const TODAY = key(_now.getFullYear(), _now.getMonth(), _now.getDate());
const TP = parse(TODAY);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const NUM = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fm = c => BRL.format((c || 0) / 100);
const fn = c => NUM.format((c || 0) / 100);
function abbr(c) {
  const v = c / 100, a = Math.abs(v);
  if (a >= 1e6) return +(v / 1e6).toPrecision(3) + 'M';
  if (a >= 1e3) return +(v / 1e3).toPrecision(3) + 'K';
  return String(Math.round(v * 10) / 10);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = (t, gray, size, dotted) => `<span class="ic ${gray ? 'gray' : ''} ${size || ''} ${dotted ? 'dotted' : ''}" style="--c:${TIPOS[t].cor}">${TIPOS[t].ic}</span>`;
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SV = {
  grid: sv('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 4v16"/>'),
  pie: sv('<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'),
  tag: sv('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  menu: sv('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  plus: '<svg class="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  money: sv('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
  swap: sv('<path d="M7 7h13l-4-4M17 17H4l4 4"/>'),
  text: sv('<path d="M4 7h16M4 12h16M4 17h10"/>'),
  card: sv('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'),
  cal: sv('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'),
  rep: sv('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  user: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  gift: sv('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
  chart: sv('<path d="M3 3v18h18"/><path d="M7 15v2M11 10v7M15 12v5M19 6v11"/>'),
  cloud: sv('<path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')
};

/* ============ estado ============ */
const STORE = 'saldos.planejamento';
const defaultState = () => ({ movs: [], cartoes: [], tags: [], previsao: { gastosMensais: [], divididoPor: 30 }, config: { tema: 'sistema' }, saldoInicial: 0, usuario: 'você', desejos: [] });
function load() {
  try { const r = localStorage.getItem(STORE); if (r) return Object.assign(defaultState(), JSON.parse(r)); } catch (e) {}
  return defaultState();
}
let S = load();
let CACHE = null, D = null;
function persistLocal() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} CACHE = null; }
function save() { persistLocal(); render(); syncMarkDirty(); }

/* ============ sincronização na nuvem (GitHub Gist privado, criptografado) ============ */
const SYNC_KEY = 'saldos.sync', SYNC_FILE = 'saldos-sync.json', SYNC_DESC = 'saldos — dados sincronizados (criptografados)';
let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } })();
const SYS = { status: 'off', msg: '', at: null, timer: null, busy: false, again: false };
function sySave() { try { SY && SY.gistId ? localStorage.setItem(SYNC_KEY, JSON.stringify(SY)) : localStorage.removeItem(SYNC_KEY); } catch (e) {} }
function b64(buf) { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEYCACHE = null;
async function getKey(salt) {
  if (KEYCACHE && KEYCACHE.salt === salt && KEYCACHE.senha === SY.senha) return KEYCACHE.key;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(SY.senha), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(salt), iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  KEYCACHE = { salt, senha: SY.senha, key }; return key;
}
async function encrypt(obj, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await getKey(salt), new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptOrFail(env) {
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, await getKey(env.salt), unb64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { const er = new Error('a senha de sincronização não confere com a usada nos outros aparelhos'); er.senha = true; throw er; }
}
async function gh(path, opt = {}) {
  let r;
  try {
    r = await fetch('https://api.github.com' + path, { method: opt.method || 'GET', body: opt.body, cache: 'no-store',
      headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + SY.token }, opt.body ? { 'Content-Type': 'application/json' } : {}) });
  } catch (e) { const er = new Error('sem conexão com a internet'); er.offline = true; throw er; }
  if (r.ok) return r.status === 204 ? null : r.json();
  const er = new Error(r.status === 401 ? 'token inválido ou expirado'
    : r.status === 403 ? 'o github recusou o acesso (confira se o token tem a permissão "gist")'
    : r.status === 404 ? (path.startsWith('/gists/') ? 'os dados da nuvem não foram encontrados' : 'o token não tem a permissão "gist"')
    : 'o github respondeu com erro ' + r.status);
  er.status = r.status; throw er;
}
async function readRemote() {
  const g = await gh('/gists/' + SY.gistId);
  const f = g.files && g.files[SYNC_FILE];
  if (!f) throw new Error('os dados da nuvem não foram encontrados');
  let txt = f.content;
  if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  return JSON.parse(txt);
}
const writeRemote = env => gh('/gists/' + SY.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify(env) } } }) });
async function findGist() {
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = list.find(g => g.files && g.files[SYNC_FILE]);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  return null;
}
function setSync(status, msg) {
  SYS.status = status; SYS.msg = msg || '';
  if (status === 'ok') SYS.at = new Date();
  try { renderTop(); if (U.page === 'menu' && U.menuView === 'sync') renderContent(); } catch (e) {}
}
async function push(salt) {
  const rev = SY.rev, at = Date.now();
  const env = Object.assign({ v: 1, app: 'saldos', updatedAt: at, salt }, await encrypt(S, salt));
  await writeRemote(env);
  SY.lastRemote = at;
  if (SY.rev === rev) SY.syncedRev = rev; else SYS.again = true;
  sySave();
}
function adoptRemote(data, at) {
  S = Object.assign(defaultState(), data); persistLocal();
  SY.lastRemote = at; SY.localAt = at; SY.syncedRev = SY.rev; sySave();
  render();
}
async function syncNow() {
  if (!SY || !SY.gistId) return;
  if (SYS.busy) { SYS.again = true; return; }
  SYS.busy = true; SYS.again = false; setSync('sync');
  try {
    const remote = await readRemote();
    const rAt = remote.updatedAt || 0, dirty = SY.rev !== SY.syncedRev, remoteNew = rAt > (SY.lastRemote || 0);
    if (remoteNew && (!dirty || rAt > (SY.localAt || 0))) {
      const data = await decryptOrFail(remote);
      adoptRemote(data, rAt);
      if (dirty) toast('havia uma versão mais recente em outro aparelho e ela foi carregada');
    } else if (dirty || remoteNew) await push(remote.salt);
    setSync('ok');
  } catch (e) { setSync(e.offline ? 'pending' : 'err', e.message); }
  finally { SYS.busy = false; if (SYS.again) setTimeout(syncNow, 300); }
}
function syncMarkDirty() {
  if (!SY || !SY.gistId) return;
  SY.rev = (SY.rev || 0) + 1; SY.localAt = Date.now(); sySave();
  clearTimeout(SYS.timer); SYS.timer = setTimeout(syncNow, 1200);
  if (SYS.status !== 'sync') setSync('sync');
}
async function conectar(token, senha) {
  const prev = SY;
  SY = { token, senha, gistId: null, lastRemote: 0, localAt: 0, rev: 0, syncedRev: 0 };
  KEYCACHE = null;
  try {
    const me = await gh('/user'); SY.login = me.login;
    const id = await findGist();
    if (!id) {
      const salt = b64(crypto.getRandomValues(new Uint8Array(16))), at = Date.now();
      const env = Object.assign({ v: 1, app: 'saldos', updatedAt: at, salt }, await encrypt(S, salt));
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: SYNC_DESC, public: false, files: { [SYNC_FILE]: { content: JSON.stringify(env) } } }) });
      SY.gistId = g.id; SY.lastRemote = at; SY.localAt = at; sySave();
      return { created: true };
    }
    SY.gistId = id;
    const remote = await readRemote();
    const data = await decryptOrFail(remote);
    return { remote, data };
  } catch (e) { SY = prev; KEYCACHE = null; throw e; }
}
function desconectar() { SY = null; KEYCACHE = null; clearTimeout(SYS.timer); try { localStorage.removeItem(SYNC_KEY); } catch (e) {} setSync('off'); }
const temDados = () => !!(S.movs.length || S.cartoes.length || S.tags.length || (S.desejos || []).length || S.previsao.gastosMensais.length || S.saldoInicial);
const U = {
  page: 'saldos', start: { y: TP.y, m: TP.m }, mostrar: 'atual',
  totais: { y: TP.y, m: TP.m }, tagsMonth: { y: TP.y, m: TP.m },
  analise: { y: TP.y, m: TP.m }, vizTable: {},
  collapsed: false, drawer: null, menuView: null, tagFilter: ''
};
let LAST_PAGE = null;

/* ============ motor de cálculo ============ */
function excl(mv) {
  const r = {}; for (const [f] of FLAGS) r[f] = false;
  for (const id of mv.tags || []) {
    const t = S.tags.find(x => x.id === id);
    if (t) for (const [f] of FLAGS) if (t.calcular && t.calcular[f] === false) r[f] = true;
  }
  return r;
}
function dueDate(k, c) {
  const p = parse(k);
  let cm = { y: p.y, m: p.m };
  if (p.d > Math.min(c.diaFechamento, dim(p.y, p.m))) cm = monthAdd(p.y, p.m, 1);
  const dm = c.diaVencimento > c.diaFechamento ? cm : monthAdd(cm.y, cm.m, 1);
  return clampKey(dm.y, dm.m, c.diaVencimento);
}
function occ(mv, end) {
  const out = [], p = parse(mv.data);
  const card = mv.tipo === 'cartao' && mv.cartaoId ? S.cartoes.find(x => x.id === mv.cartaoId) : null;
  const push = (k, v, i, n) => { const e = card ? dueDate(k, card) : k; if (e <= end) out.push({ k: e, orig: k, v, i, n }); };
  switch (mv.repeticao) {
    case 'mensal':
      for (let i = 0; ; i++) { const t = monthAdd(p.y, p.m, i); const k = clampKey(t.y, t.m, p.d); if (k > end) break; push(k, mv.valor); }
      break;
    case 'semanal': for (let k = mv.data; k <= end; k = addDays(k, 7)) push(k, mv.valor); break;
    case 'diaria': for (let k = mv.data; k <= end; k = addDays(k, 1)) push(k, mv.valor); break;
    case 'parcelado': {
      const n = Math.max(1, mv.parcelas | 0), base = Math.floor(mv.valor / n), r = mv.valor - base * n;
      for (let i = 0; i < n; i++) { const t = monthAdd(p.y, p.m, i); const k = clampKey(t.y, t.m, p.d); if (k > end) break; push(k, base + (i < r ? 1 : 0), i + 1, n); }
      break;
    }
    default: push(mv.data, mv.valor);
  }
  return out;
}
function compute(end) {
  if (CACHE && CACHE.end >= end) return CACHE;
  const days = {}; let first = null;
  for (const mv of S.movs) {
    const ex = excl(mv);
    for (const o of occ(mv, end)) {
      let d = days[o.k];
      if (!d) d = days[o.k] = { disp: { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0 }, net: 0, items: [] };
      d.disp[mv.tipo] += o.v;
      if (!ex.saldos) d.net += mv.tipo === 'entrada' ? o.v : -o.v;
      d.items.push({ mv, ex, v: o.v, k: o.k, orig: o.orig, i: o.i, n: o.n });
      if (!first || o.k < first) first = o.k;
    }
  }
  const sal = {}; let s = S.saldoInicial || 0;
  if (first) for (let k = first; k <= end; k = addDays(k, 1)) { const d = days[k]; if (d) s += d.net; sal[k] = s; }
  CACHE = { end, days, sal, first };

}
function saldoAt(k) { if (!D.first || k < D.first) return S.saldoInicial || 0; return D.sal[k] ?? 0; }
function neededEnd() {
  const e = monthAdd(U.start.y, U.start.m, 11);
  let end = lastDay(e);
  const c = [addDays(TODAY, 3), lastDay(U.totais), lastDay(U.tagsMonth), lastDay(monthAdd(U.analise.y, U.analise.m, 2))];
  if (U.drawer) c.push(U.drawer.mode === 'day' ? U.drawer.ref : lastDay(U.drawer.ref));
  for (const x of c) if (x > end) end = x;
  return end;
}
function mtot(y, m, flag) {
  const r = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0 };
  for (let d = 1, n = dim(y, m); d <= n; d++) {
    const dd = D.days[key(y, m, d)]; if (!dd) continue;
    for (const it of dd.items) { if (flag && it.ex[flag]) continue; r[it.mv.tipo] += it.v; }
  }
  return r;
}
const prevDiaria = () => S.previsao.gastosMensais.reduce((a, g) => a + g.valor, 0) / (S.previsao.divididoPor || 30);
function diasRestantes(y, m) {
  const cmp = y * 12 + m - (TP.y * 12 + TP.m);
  if (cmp < 0) return 0;
  if (cmp === 0) return dim(y, m) - TP.d;
  return dim(y, m);
}
const prevRest = (y, m) => Math.round(prevDiaria() * diasRestantes(y, m));

function renderSaldos() {

function monthCard(y, m) {
  const n = dim(y, m), sum = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0 };
  let rows = '';
  for (let d = 1; d <= n; d++) {
    const k = key(y, m, d), dd = D.days[k], w = dow(k), we = w === 0 || w === 6, isT = k === TODAY;
    let tds = '';
    for (const t of ORD) {
      const v = dd ? dd.disp[t] : 0; sum[t] += v;
      tds += `<td class="v ${v ? '' : 'z'}" data-act="day" data-k="${k}" data-f="${t}"><span class="cw">${ic(t, !v, 'sm')}<span>${fn(v)}</span></span></td>`;
    }
    const s = saldoAt(k), tn = TONES[tone(s)];
    rows += `<tr class="${isT ? 'today' : ''}" ${isT ? 'id="today-row"' : ''}><td class="dia ${we ? 'we' : ''} ${isT ? 'td' : ''}">${pad(d)}</td>${tds}<td class="sal" data-act="day" data-k="${k}" data-f="todas" style="background:${tn[0]};color:${tn[1]}">${fn(s)}</td></tr>`;
  }
  const head = `<tr><th>dia</th>${ORD.map(t => `<th><span class="cw">${ic(t, false, 'sm')}<span>${TIPOS[t].col}</span></span></th>`).join('')}<th>saldos</th></tr>`;
  const foot = `<tr><td></td>${ORD.map(t => `<td class="${sum[t] ? '' : 'muted'}"><span class="cw">${ic(t, !sum[t], 'sm')}<span>${fn(sum[t])}</span></span></td>`).join('')}<td></td></tr>`;
  return `<div class="mcard"><div class="mtitle">${MESES[m]} de ${y}</div><div class="tw"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div></div>`;
}
function scrollToday(smooth) {
  requestAnimationFrame(() => {
    const r = document.getElementById('today-row'); if (!r) return;
    const card = r.closest('.mcard'), ms = $('#months'), tw = r.closest('.tw');

function renderHorizonte() {
  const ms = []; for (let i = 0; i < 12; i++) ms.push(monthAdd(U.start.y, U.start.m, i));

/* --- desejos --- */
function desejoStats() {
  const st = {}; let geral = 0, livre = 0;
  for (const w of S.desejos) st[w.id] = { hoje: 0, proj: 0, quando: null };
  for (const k of Object.keys(D.days).sort()) {
    for (const it of D.days[k].items) {
      if (it.mv.tipo !== 'economia') continue;
      if (k <= TODAY) { geral += it.v; if (!it.mv.desejoId || !st[it.mv.desejoId]) livre += it.v; }
      const s = st[it.mv.desejoId]; if (!s) continue;
      s.proj += it.v; if (k <= TODAY) s.hoje += it.v;
      const w = S.desejos.find(x => x.id === it.mv.desejoId);
      if (!s.quando && s.proj >= w.valor) s.quando = k;
    }
  }
  return { st, geral, livre };
}

    </div>

    <div class="wlist">${ativos.length ? ativos.map(card).join('') : '<div class="lst"><div class="empty">sua lista de desejos está vazia. toque em "+ novo desejo" para começar.</div></div>'}</div>

/* --- análise --- */
function niceScale(v) {
  if (v <= 0) return { max: 40000, step: 10000, count: 4 };
  const x = v / 4, e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  const count = Math.max(1, Math.ceil(v / step - 1e-9));
  return { max: step * count, step, count };
}

function renderAnalise() {
  const { y, m } = U.analise, n = dim(y, m);
  const days = []; for (let d = 1; d <= n; d++) days.push(key(y, m, d));
  const base = k => ({ k, label: String(parse(k).d), title: `${ddmm(k)} · ${['dom','seg','ter','qua','qui','sex','sáb'][dow(k)]}`, today: k === TODAY, vals: {} });

  // 1) gasto por dia
  const gSeries = ['saida', 'diario', 'cartao'].map(t => ({ id: t, name: TIPOS[t].col, color: TIPOS[t].cor, total: 0 }));
  const gCols = days.map(k => { const c = base(k), dd = D.days[k]; for (const sr of gSeries) { const v = dd ? dd.disp[sr.id] : 0; c.vals[sr.id] = v; sr.total += v; } return c; });
  const gasto = gSeries.reduce((a, x) => a + x.total, 0);
  let maior = null; gCols.forEach(c => { const t = c.vals.saida + c.vals.diario + c.vals.cartao; if (t && (!maior || t > maior.v)) maior = { v: t, k: c.k }; });
  const cmp = y * 12 + m - (TP.y * 12 + TP.m), dec = cmp < 0 ? n : cmp === 0 ? TP.d : 0;
  const DSEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const porSem = [0, 0, 0, 0, 0, 0, 0];
  gCols.forEach(c => porSem[dow(c.k)] += c.vals.saida + c.vals.diario + c.vals.cartao);
  const semTop = porSem.some(v => v) ? porSem.indexOf(Math.max(...porSem)) : -1;
  const semGasto = gCols.slice(0, dec).filter(c => !(c.vals.saida + c.vals.diario + c.vals.cartao)).length;

  // 2) cartão por dia (data da compra)
  const cards = S.cartoes.slice(0, 5).map((c, i) => ({ id: c.id, name: c.nome, color: `var(--s${i + 1})`, total: 0 }));
  const outros = { id: '_outros', name: 'outros cartões', color: 'var(--s-other)', total: 0 };
  const semCard = { id: '_fatura', name: 'faturas (sem cartão)', color: 'var(--s-other)', total: 0 };
  const cCols = days.map(base), idx = Object.fromEntries(days.map((k, i) => [k, i]));
  for (const k in D.days) for (const it of D.days[k].items) {
    if (it.mv.tipo !== 'cartao' || idx[it.orig] === undefined) continue;
    const card = it.mv.cartaoId && S.cartoes.find(c => c.id === it.mv.cartaoId);
    const sid = !card ? '_fatura' : cards.find(c => c.id === card.id) ? card.id : '_outros';
    const col = cCols[idx[it.orig]]; col.vals[sid] = (col.vals[sid] || 0) + it.v;
  }
  const allC = [...cards, outros, semCard];
  cCols.forEach(c => allC.forEach(x => x.total += c.vals[x.id] || 0));
  const cSeries = allC.filter(x => x.total > 0);
  const totCartao = cSeries.reduce((a, x) => a + x.total, 0);

  // 3) visão geral
  const t = mtot(y, m, null);
  const pm = monthAdd(y, m, -1), tp = mtot(pm.y, pm.m, null);
  const varPct = (a, b) => b ? (a - b) / b * 100 : (a ? null : 0);
  const cmpRows = ORD.map(k => ({ k, a: t[k], b: tp[k], p: varPct(t[k], tp[k]) }));
  const cmpMax = Math.max(1, ...cmpRows.flatMap(r => [r.a, r.b]));
  const gastoPrev = tp.saida + tp.diario + tp.cartao;

  // 4) economia
  let cum = 0; const eCols = days.map(k => { const dd = D.days[k], v = dd ? dd.disp.economia : 0; cum += v; return { ...base(k), v, cum }; });
  const dest = {};
  for (const k of days) { const dd = D.days[k]; if (!dd) continue; for (const it of dd.items) if (it.mv.tipo === 'economia') { const w = it.mv.desejoId && S.desejos.find(x => x.id === it.mv.desejoId); const nm = w ? w.nome : 'reserva geral'; dest[nm] = (dest[nm] || 0) + it.v; } }
  const destRows = Object.entries(dest).sort((a, b) => b[1] - a[1]).map(([nm, v]) => ({ name: nm, v, color: 'var(--eco-line)' }));

  const mesNome = `${MESES[m]} de ${y}`;
  return `<div style="max-width:1180px;margin:0 auto">
    <div class="ahero">
      <div class="tc"><span class="st">maior gasto num dia</span><span class="num">${maior ? fm(maior.v) : fm(0)}</span><small class="muted">${maior ? `em ${ddmm(maior.k)}` : 'sem gastos'}</small></div>
      <div class="tc"><span class="st">dia da semana que mais gasta</span><span class="num">${semTop >= 0 ? DSEM[semTop] : '—'}</span><small class="muted">${semTop >= 0 ? `${fm(porSem[semTop])} no mês` : 'sem gastos'}</small></div>
      <div class="tc"><span class="st">dias sem gastos</span><span class="num">${dec ? `${semGasto} de ${dec}` : '—'}</span><small class="muted">${dec ? 'dias já decorridos no mês' : 'mês ainda não começou'}</small></div>
      <div class="tc"><span class="st">gasto × mês anterior</span><span class="num">${(() => { const p = varPct(gasto, gastoPrev); return p === null ? 'novo' : `${p > 0 ? '▲ +' : p < 0 ? '▼ ' : ''}${p.toFixed(0)}%`; })()}</span><small class="muted">${fm(gasto)} agora · ${fm(gastoPrev)} em ${MAB[pm.m]}/${pm.y}</small></div>
    </div>
    <div class="viz">
      <div class="vc full">${vizHead('gasto', 'valor gasto por dia', `${mesNome} · cartão entra na data do vencimento`)}
        ${U.vizTable.gasto ? '' : legend(gSeries)}${barChart('gasto', gCols, gSeries, { aria: 'gasto por dia em ' + mesNome })}</div>
      <div class="vc full">${vizHead('cartao', 'gasto no cartão de crédito por dia', `${mesNome} · pela data da compra, somado por cartão`)}
        ${cSeries.length ? (U.vizTable.cartao ? '' : legend(cSeries)) + barChart('cartao', cCols, cSeries, { aria: 'gasto no cartão por dia em ' + mesNome }) : '<div class="empty">nenhum gasto com cartão neste mês.</div>'}
        ${cSeries.length ? `<div class="muted" style="margin-top:6px">total no cartão: <b>${fm(totCartao)}</b></div>` : ''}</div>
      <div class="vc">${vizHead('geral', 'categorias × mês anterior', `${MAB[m]}/${y} comparado a ${MAB[pm.m]}/${pm.y}`)}
        ${U.vizTable.geral ? `<table class="vtab"><thead><tr><th>categoria</th><th>${MAB[pm.m]}/${pm.y}</th><th>${MAB[m]}/${y}</th><th>variação</th></tr></thead><tbody>${cmpRows.map(r => `<tr><td>${TIPOS[r.k].col}</td><td>${fm(r.b)}</td><td>${fm(r.a)}</td><td>${r.p === null ? 'novo' : r.p.toFixed(0) + '%'}</td></tr>`).join('')}</tbody></table>`
        : `<div class="lgd"><span><i style="background:var(--text-secondary)"></i>${MAB[m]}/${y} (cor da categoria)</span><span><i style="background:var(--s-other)"></i>${MAB[pm.m]}/${pm.y}</span></div>
        <div class="cmpl">${cmpRows.map(r => {
          const bom = r.k === 'entrada' || r.k === 'economia';
          const cls = r.p === null || r.p === 0 ? 'muted' : (r.p > 0) === bom ? 'wok' : 'wbad';
          const txt = r.p === null ? 'novo' : r.p === 0 ? 'igual' : `${r.p > 0 ? '▲ +' : '▼ '}${r.p.toFixed(0)}%`;
          return `<div class="cmpr" ${tipAttr(`<b>${TIPOS[r.k].col}</b>${tipRow(TIPOS[r.k].cor, `${MAB[m]}/${y}`, r.a)}${tipRow('var(--s-other)', `${MAB[pm.m]}/${pm.y}`, r.b)}`)}>
            <span class="hbl">${ic(r.k, !r.a && !r.b, 'sm')}${TIPOS[r.k].col}</span>
            <span class="cmpb"><span class="hbt"><i style="width:${r.a / cmpMax * 100}%;background:${TIPOS[r.k].cor}"></i></span><span class="hbt thin"><i style="width:${r.b / cmpMax * 100}%;background:var(--s-other)"></i></span></span>
            <span class="num">${fm(r.a)}</span><span class="${cls}" style="text-align:right">${txt}</span></div>`;
        }).join('')}</div>`}</div>
      <div class="vc">${vizHead('eco', 'evolução da economia no mês', 'valor acumulado dia a dia e destino do dinheiro')}
        ${t.economia ? lineChart('eco', eCols, { aria: 'economia acumulada em ' + mesNome }) : '<div class="empty">sem economias neste mês.</div>'}

    </div></div>`;

function drawerItems() {

  else { const { y, m } = dr.ref; for (let d = 1, n = dim(y, m); d <= n; d++) { const dd = D.days[key(y, m, d)]; if (dd) its.push(...dd.items); } }

function renderDrawer() {

/* ============ popover ============ */
let POP = null;
function closePop() { if (POP) { POP.remove(); POP = null; } }
function popHTML(anchor, html, onClick) {
  closePop();
  const el = document.createElement('div');
  el.className = 'pop'; el.innerHTML = html; document.body.appendChild(el);
  const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  const b = anchor.getBoundingClientRect(), r = { left: b.left / z, top: b.top / z, bottom: b.bottom / z };
  const W = innerWidth / z, H = innerHeight / z, w = el.offsetWidth, h = el.offsetHeight;
  let top = r.bottom + 6, left = r.left;
  if (left + w > W - 8) left = W - 8 - w;
  if (top + h > H - 8) top = Math.max(8, r.top - 6 - h);
  el.style.top = top + 'px'; el.style.left = Math.max(8, left) + 'px';
  el.addEventListener('click', e => { e.stopPropagation(); onClick && onClick(e, el); });
  POP = el; return el;
}
function popMenu(anchor, title, items, cb) {
  const html = (title ? `<div class="pt">${title}</div>` : '') + items.map(it =>
    `<button class="pi ${it.danger ? 'danger' : ''}" data-v="${it.v}">${it.icon || ''}<span class="grow"><b>${it.label}</b>${it.desc ? `<small>${it.desc}</small>` : ''}</span>${it.check ? '<span class="check">✓</span>' : ''}</button>`).join('');
  popHTML(anchor, html, e => { const b = e.target.closest('.pi'); if (b) { closePop(); cb(b.dataset.v); } });
}
document.addEventListener('click', e => { if (POP && !POP.contains(e.target)) closePop(); }, true);

function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function ask(msg, okLabel, cb, danger = true) {
  const el = document.createElement('div'); el.className = 'ov center'; el.style.zIndex = 70;
  el.innerHTML = `<div class="modal sm"><p style="margin:4px 0 0;font-size:15px;line-height:1.4">${msg}</p><div class="btns"><button class="ghost" data-x>cancelar</button><button class="primary ${danger ? 'danger' : 'dark'}" data-ok>${okLabel}</button></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (e.target === el || e.target.closest('[data-x]')) el.remove();
    else if (e.target.closest('[data-ok]')) { el.remove(); cb(); }
  });
}
function choose(msg, opts, cb) {
  const el = document.createElement('div'); el.className = 'ov center'; el.style.zIndex = 70;
  el.innerHTML = `<div class="modal sm"><p style="margin:4px 0 6px;font-size:15px;line-height:1.45">${msg}</p>
    ${opts.map(o => `<button class="primary ${o.cls === 'light' ? '' : 'dark'}" style="margin-top:10px;${o.cls === 'light' ? 'background:var(--surface);color:var(--text-primary);border:1px solid var(--border)' : ''}" data-v="${o.v}">${o.label}</button>`).join('')}
    <button class="ghost" style="width:100%;margin-top:10px" data-x>cancelar</button></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('[data-v]');
    if (b) { el.remove(); cb(b.dataset.v); }
    else if (e.target === el || e.target.closest('[data-x]')) { el.remove(); cb(null); }
  });
}

      { id: uid() + 9, tipo: 'diario', valor: 4500, descricao: 'feira', data: k(4), repeticao: 'semanal', tags: [tCasa] },
      { id: uid() + 10, tipo: 'cartao', valor: 240000, descricao: 'notebook', data: k(12), repeticao: 'parcelado', parcelas: 6, cartaoId: c2, tags: [] },
      { id: uid() + 12, tipo: 'economia', valor: 40000, descricao: 'guardar para a viagem', data: k(6), repeticao: 'mensal', desejoId: '__W1__', tags: [] },
      { id: uid() + 13, tipo: 'economia', valor: 50000, descricao: 'guardar para o celular', data: clampKey(prevM.y, prevM.m, 25), repeticao: 'mensal', desejoId: '__W2__', tags: [] },
      { id: uid() + 11, tipo: 'saida', valor: 35000, descricao: 'conserto do carro', data: clampKey(prevM.y, prevM.m, 20), repeticao: 'nao_repete', tags: [] }
    ]
  });
  S.movs.forEach(m => { if (m.desejoId === '__W1__') m.desejoId = S.desejos[0].id; if (m.desejoId === '__W2__') m.desejoId = S.desejos[1].id; });
  save(); toast('exemplo carregado');
  if (U.page === 'saldos') scrollToday(true);
}
function exportar() {
  try {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `saldos-${TODAY}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { toast('não foi possível exportar aqui'); }
}
$('#impfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || !Array.isArray(o.movs)) throw 0;
      S = Object.assign(defaultState(), o); save(); toast('dados importados');
    } catch (err) { toast('arquivo inválido'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ============ ações ============ */
function goToday() {
  const s = U.start.y * 12 + U.start.m, t = TP.y * 12 + TP.m;
  if (t < s || t > s + 11) { U.start = { y: TP.y, m: TP.m }; U.mostrar = 'atual'; }
  U.page = 'saldos'; U.menuView = null; render(); scrollToday(true);
}
function setMostrar(v) {
  U.mostrar = v;
  U.start = v === 'anterior' ? monthAdd(TP.y, TP.m, -1) : v === 'ano' ? { y: TP.y, m: 0 } : { y: TP.y, m: TP.m };
  render(); if (U.page === 'saldos') scrollToday(false);
}
const ACT = {
  nav: a => { U.page = a.dataset.p; U.menuView = null; render(); if (U.page === 'saldos') scrollToday(false); },
  add: a => popMenu(a, '', typeItems(), t => openMov({ tipo: t })),
  hoje: goToday,
  collapse: () => { U.collapsed = !U.collapsed; render(); },
  per: a => { const t = monthAdd(U.start.y, U.start.m, +a.dataset.n); U.start = t; render(); },
  mostrar: a => popMenu(a, 'mostrar', [
    { v: 'atual', label: 'mês atual + 11 meses', check: U.mostrar === 'atual' },
    { v: 'anterior', label: 'mês anterior + 11 meses', check: U.mostrar === 'anterior' },
    { v: 'ano', label: 'ano atual', check: U.mostrar === 'ano' }], setMostrar),
  tm: a => { U.totais = monthAdd(U.totais.y, U.totais.m, +a.dataset.n); render(); },
  am: a => { U.analise = monthAdd(U.analise.y, U.analise.m, +a.dataset.n); render(); },
  'viz-tab': a => { U.vizTable[a.dataset.c] = !U.vizTable[a.dataset.c]; render(); },
  gm: a => { U.tagsMonth = monthAdd(U.tagsMonth.y, U.tagsMonth.m, +a.dataset.n); render(); },
  day: a => openDrawer('day', a.dataset.k, a.dataset.f),
  'ver-todas': () => openDrawer('month', { ...U.totais }, 'todas'),
  'ver-tipo': a => openDrawer('month', { ...U.totais }, a.dataset.f),
  'dr-close': closeDrawer,
  'dr-nav': a => {
    const dr = U.drawer, n = +a.dataset.n;
    dr.ref = dr.mode === 'day' ? addDays(dr.ref, n) : monthAdd(dr.ref.y, dr.ref.m, n);
    render();
  },
  'dr-add': a => popMenu(a, '', typeItems(), t => openMov({ tipo: t, data: U.drawer.mode === 'day' ? U.drawer.ref : TODAY })),
  'dr-filter': a => {
    const f = U.drawer.filter;
    const el = popHTML(a, `<div class="pt">mostrar</div><label class="chk"><input type="checkbox" data-all ${f.size === 5 ? 'checked' : ''}> <b>todas</b></label>
      ${ORD.map(t => `<label class="chk"><input type="checkbox" value="${t}" ${f.has(t) ? 'checked' : ''}> ${ic(t)} ${TIPOS[t].col}</label>`).join('')}
      <button class="primary dark" style="margin-top:8px;padding:10px" data-apply>aplicar</button>`, (e, el) => {
      if (e.target.matches('[data-all]')) el.querySelectorAll('input[value]').forEach(i => i.checked = e.target.checked);
      else if (e.target.matches('input[value]')) el.querySelector('[data-all]').checked = [...el.querySelectorAll('input[value]')].every(i => i.checked);
      if (e.target.closest('[data-apply]')) {
        const sel = [...el.querySelectorAll('input[value]:checked')].map(i => i.value);
        U.drawer.filter = new Set(sel.length ? sel : ORD); closePop(); renderDrawer();
      }
    });
  },
  'it-menu': a => {
    const mv = S.movs.find(x => x.id === a.dataset.id); if (!mv) return;
    popMenu(a, '', [{ v: 'edit', label: 'editar' }, { v: 'del', label: 'apagar', danger: true }], v => {
      if (v === 'edit') openMov(JSON.parse(JSON.stringify(mv)));
      else ask(`apagar <b>${esc(mv.descricao || TIPOS[mv.tipo].nome)}</b>?${mv.repeticao !== 'nao_repete' ? '<br><small class="muted">todas as repetições serão apagadas.</small>' : ''}`, 'apagar', () => { S.movs = S.movs.filter(x => x.id !== mv.id); save(); toast('movimentação apagada'); });
    });
  },
  'm-bg': (a, e) => { if (e.target === a) { M = null; TG = null; closeModal(); } },
  'm-close': () => { M = null; TG = null; closeModal(); },
  'm-tipo': a => { syncMov(); popMenu(a, 'mudar para', typeItems(M.tipo), t => { M.tipo = t; if (t === 'cartao' && !M.cartaoId && S.cartoes[0] && !M.id) M.cartaoId = S.cartoes[0].id; renderMov(); }); },
  'm-rep': a => { syncMov(); popMenu(a, 'repetir', Object.entries(REP).map(([v, [l, d]]) => ({ v, label: l, desc: d, check: M.repeticao === v })), v => { M.repeticao = v; renderMov(); }); },
  'm-tag': a => { syncMov(); const id = a.dataset.id; M.tags = M.tags.includes(id) ? M.tags.filter(x => x !== id) : [...M.tags, id]; renderMov(); },
  'm-save': saveMov,
  'tag-new': () => openTag(null),
  'tag-menu': a => {
    const t = S.tags.find(x => x.id === a.dataset.id);
    popMenu(a, '', [{ v: 'edit', label: 'editar' }, { v: 'del', label: 'apagar', danger: true }], v => {
      if (v === 'edit') openTag(t);
      else ask(`apagar a tag <b>${esc(t.nome)}</b>? as movimentações continuam, só perdem a tag.`, 'apagar', () => { S.tags = S.tags.filter(x => x.id !== t.id); S.movs.forEach(m => m.tags = (m.tags || []).filter(x => x !== t.id)); save(); });
    });
  },
  't-cor': a => { syncTag(); TG.cor = a.dataset.v; renderTag(); },
  't-adv': () => { syncTag(); TG.adv = !TG.adv; renderTag(); },
  't-flag': a => { syncTag(); TG.calcular[a.dataset.f] = a.dataset.v === '1'; renderTag(); },
  't-save': saveTag,
  'menu-go': a => { U.menuView = a.dataset.v || null; render(); },
  perfil: () => formModal('editar perfil', [{ id: 'nome', ph: 'seu nome', value: S.usuario, icon: SV.user, attrs: 'maxlength="40"' }], 'salvar', v => { if (!v.nome.trim()) return 'informe um nome.'; S.usuario = v.nome.trim(); }),
  'gm-add': () => formModal('novo gasto mensal', [{ id: 'valor', type: 'money', value: 0 }, { id: 'desc', ph: 'descrição', attrs: 'maxlength="40"' }], 'adicionar gasto mensal', v => { if (!(v.valor > 0)) return 'informe um valor maior que zero.'; S.previsao.gastosMensais.push({ valor: v.valor, descricao: v.desc.trim() }); }),
  'gm-menu': a => {
    const i = +a.dataset.i, g = S.previsao.gastosMensais[i];
    popMenu(a, '', [{ v: 'edit', label: 'editar' }, { v: 'del', label: 'apagar', danger: true }], v => {
      if (v === 'edit') formModal('editar gasto mensal', [{ id: 'valor', type: 'money', value: g.valor }, { id: 'desc', ph: 'descrição', value: g.descricao }], 'salvar', x => { if (!(x.valor > 0)) return 'informe um valor maior que zero.'; S.previsao.gastosMensais[i] = { valor: x.valor, descricao: x.desc.trim() }; });
      else { S.previsao.gastosMensais.splice(i, 1); save(); }
    });
  },
  'desejo-new': () => openDesejo(null),
  'desejo-poupar': a => openMov({ tipo: 'economia', desejoId: a.dataset.id, descricao: 'guardar para ' + (S.desejos.find(x => x.id === a.dataset.id)?.nome || '') }),
  'desejo-menu': a => {
    const w = S.desejos.find(x => x.id === a.dataset.id);
    popMenu(a, '', [{ v: 'edit', label: 'editar' }, { v: 'toggle', label: w.comprado ? 'voltar para a lista' : 'marcar como comprado' }, { v: 'del', label: 'apagar', danger: true }], v => {
      if (v === 'edit') openDesejo(w);
      else if (v === 'toggle') { w.comprado = !w.comprado; save(); }
      else ask(`apagar <b>${esc(w.nome)}</b>? as economias vinculadas continuam e passam a ser reserva geral.`, 'apagar', () => { S.desejos = S.desejos.filter(x => x.id !== w.id); S.movs.forEach(m => { if (m.desejoId === w.id) delete m.desejoId; }); save(); });
    });
  },
  'card-add': () => openCard(null),
  'card-menu': a => {
    const c = S.cartoes.find(x => x.id === a.dataset.id);
    popMenu(a, '', [{ v: 'edit', label: 'editar' }, { v: 'del', label: 'apagar', danger: true }], v => {
      if (v === 'edit') openCard(c);
      else ask(`apagar o cartão <b>${esc(c.nome)}</b>? os gastos dele passam a pesar na data da compra.`, 'apagar', () => { S.cartoes = S.cartoes.filter(x => x.id !== c.id); S.movs.forEach(m => { if (m.cartaoId === c.id) m.cartaoId = null; }); save(); });
    });
  },
  tema: a => { S.config.tema = a.dataset.v; save(); },
  'sync-open': () => { U.page = 'menu'; U.menuView = 'sync'; render(); },
  'sync-now': () => syncNow(),
  'sync-off': () => ask('desconectar este aparelho? os dados daqui continuam, mas param de sincronizar. a cópia na nuvem não é apagada.', 'desconectar', () => { desconectar(); render(); toast('sincronização desligada neste aparelho'); }),
  'sync-connect': async () => {
    const token = ($('#sy-token').value || '').trim(), senha = $('#sy-senha').value || '', err = $('#sy-err'), btn = $('#sy-btn');
    if (!/^(ghp_|github_pat_|gho_)/.test(token)) { err.textContent = 'cole o token do github (começa com ghp_).'; return; }
    if (senha.length < 6) { err.textContent = 'a senha precisa ter pelo menos 6 caracteres.'; return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = 'este navegador não permite criptografia aqui. abra o app pelo link https.'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'conectando…';
    let res;
    try { res = await conectar(token, senha); }
    catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'conectar'; return; }
    if (res.created) { setSync('ok'); render(); toast('sincronização ativada — seus dados foram para a nuvem'); return; }
    const at = res.remote.updatedAt || Date.now();
    const usarNuvem = () => { adoptRemote(res.data, at); setSync('ok'); toast('dados da nuvem carregados'); };
    if (!temDados()) { usarNuvem(); return; }
    choose('já existem dados na nuvem e também neste aparelho. qual versão você quer manter?<br><small class="muted">a outra será substituída.</small>', [
      { v: 'nuvem', label: 'usar os dados da nuvem', cls: 'dark' },
      { v: 'local', label: 'enviar os dados deste aparelho', cls: 'light' }
    ], async v => {
      if (!v) { SY = null; KEYCACHE = null; render(); return; }
      if (v === 'nuvem') return usarNuvem();
      sySave(); SY.rev = 1; SY.localAt = Date.now(); setSync('sync');
      try { await push(res.remote.salt); setSync('ok'); toast('dados deste aparelho enviados para a nuvem'); } catch (e) { setSync('err', e.message); }
      render();
    });
  },
  exp: exportar,
  imp: () => $('#impfile').click(),
  exemplo: () => S.movs.length ? ask('carregar o exemplo substitui seus dados atuais. continuar?', 'carregar exemplo', exemplo) : exemplo(),
  zerar: () => ask('zerar a conta apaga todas as movimentações, cartões, tags e previsões' + (SY && SY.gistId ? ' — <b>em todos os aparelhos sincronizados</b>.' : '.'), 'continuar', () => ask('tem certeza? essa ação não pode ser desfeita.', 'zerar minha conta', () => { S = Object.assign(defaultState(), { usuario: S.usuario, config: S.config }); save(); toast('conta zerada'); })),
  apagar: () => ask('apagar a conta remove todos os seus dados deste navegador' + (SY && SY.gistId ? ' e desconecta a sincronização. a cópia na nuvem continua guardada.' : '.'), 'continuar', () => ask('tem certeza? essa ação não pode ser desfeita.', 'apagar minha conta', () => { desconectar(); try { localStorage.removeItem(STORE); } catch (e) {} S = defaultState(); U.menuView = null; U.page = 'saldos'; save(); toast('conta apagada'); }))
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) f(a, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-money]')) {
    const neg = el.hasAttribute('data-allowneg') && el.value.includes('-');
    const dg = el.value.replace(/\D/g, '').slice(0, 11);
    const c = (+dg || 0) * (neg ? -1 : 1);
    el.dataset.cents = c; el.value = (neg && c === 0 ? '-' : '') + fm(c);
  }
  if (el.id === 'tagq') {
    U.tagFilter = el.value; const pos = el.selectionStart;
    renderContent(); const n = $('#tagq'); n.focus(); n.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  if (el.dataset.chg === 'div') { S.previsao.divididoPor = +el.value; save(); }
  if (el.dataset.chg === 'saldoini') { S.saldoInicial = cents(el); save(); toast('saldo inicial atualizado'); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (POP) closePop(); else if ($('#modal-root').innerHTML) { M = null; TG = null; closeModal(); } else if (U.drawer) closeDrawer();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyTheme());

const TIP = document.createElement('div'); TIP.className = 'tip'; document.body.appendChild(TIP);
const zoomOf = () => parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
function placeTip(e) {
  const z = zoomOf(), W = innerWidth / z, H = innerHeight / z;
  let x = e.clientX / z + 14, y = e.clientY / z + 14;
  if (x + TIP.offsetWidth > W - 8) x = e.clientX / z - TIP.offsetWidth - 14;
  if (y + TIP.offsetHeight > H - 8) y = e.clientY / z - TIP.offsetHeight - 14;
  TIP.style.left = Math.max(8, x) + 'px'; TIP.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { TIP.innerHTML = t.getAttribute('data-tip'); TIP.style.display = 'block'; placeTip(e); } else TIP.style.display = 'none'; });
document.addEventListener('mousemove', e => { if (TIP.style.display === 'block') placeTip(e); });
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && matchMedia('(hover: none)').matches) { TIP.innerHTML = t.getAttribute('data-tip'); TIP.style.display = 'block'; placeTip(e); } });

if (SY && SY.gistId) SYS.status = 'idle';
render();
scrollToday(false);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
if (SY && SY.gistId) syncNow();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
addEventListener('online', () => syncNow());
setInterval(() => { if (document.visibilityState === 'visible' && !SYS.busy) syncNow(); }, 60000);
</script>
